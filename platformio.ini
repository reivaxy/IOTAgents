; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp_wroom_32E]
platform = espressif32
board = esp32dev
monitor_port = COM6
upload_port = COM6
monitor_filters = esp32_exception_decoder

[env:esp8266]
platform = espressif8266@^4.2.1
board = esp12e
monitor_port = COM15
upload_port = COM15
board_build.f_cpu = 160000000L
build_type = debug
monitor_filters = esp8266_exception_decoder
lib_deps =
	${env.lib_deps}
	vshymanskyy/Preferences@^2.1.0


[env]
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
build_unflags = -std=gnu++11 -std=c++11
build_flags = 
	-std=gnu++17
	-Wall
	-DCORE_DEBUG_LEVEL=3
lib_deps = 
  bblanchon/ArduinoJson@^7.2.2
  https://github.com/reivaxy/XOLEDDisplay/archive/refs/tags/v1.0.tar.gz
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.3.0
  https://github.com/reivaxy/XIOTDisplay/archive/refs/tags/v0.1.tar.gz
	ricmoo/QRCode@^0.0.1
extra_scripts = 
	pre:scripts/build_info.py
	pre:scripts/firmware_name.py